[project]
name = "vocab-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.165.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.9",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-openpyxl>=3.1.5.20261017",
]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
